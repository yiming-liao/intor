name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: true

    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm dedupe --check

      - run: pnpm run ci

  cli-minimum-node:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm build:all
      - uses: actions/setup-node@v4
        with:
          node-version: 20.12.0
      - run: node packages/intor-cli/scripts/test-minimum-node.mjs
